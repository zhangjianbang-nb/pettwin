[project]
name = "pettwin-server"
version = "0.1.0"
description = "PetTwin — behavioral memory twin for real pets"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dino = ["torch>=2.0", "torchvision>=0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
