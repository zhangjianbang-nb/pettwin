name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" httpx pydantic numpy pytest pytest-asyncio python-multipart opencv-python-headless
      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          PETTWIN_DATA_DIR: /tmp/pettwin-ci
